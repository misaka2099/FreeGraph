[connectivity]
# Kernel Declarations from all files
nk=alloc_access_kernel:1:alloc_access_kernel_1
nk=pma_insert_vertex:2:pma_insert_vertex_1,pma_insert_vertex_2
nk=pma_insert_edge:2:pma_insert_edge_1,pma_insert_edge_2
nk=update_message_generator:1:update_message_generator_1
nk=update_message_router:1:update_message_router_1
nk=pma_read_kernel:1:pma_read_kernel_1
nk=signal_kernel:1:signal_kernel_1
nk=mem_access_kernel:1:mem_access_kernel_1
nk=edge_reader:1:edge_reader_1
# Kernel Instance to SLR Assignments
# SLR0 (Closest to HBM)
slr=mem_access_kernel_1:SLR0
slr=alloc_access_kernel_1:SLR0
slr=update_message_generator_1:SLR0
slr=pma_read_kernel_1:SLR0
slr=edge_reader_1:SLR0
# SLR1 (Middle)
slr=signal_kernel_1:SLR1
slr=update_message_router_1:SLR1
slr=pma_insert_vertex_1:SLR1
slr=pma_insert_vertex_2:SLR1

# SLR2 (Top)
slr=pma_insert_edge_1:SLR2
slr=pma_insert_edge_2:SLR2

# sp=pma_update_kernel_1.hbm_ptr:HBM[0:15]
# sp=pma_update_kernel_2.hbm_ptr:HBM[0:15]
sp=mem_access_kernel_1.hbm_ptr_1:HBM[0]
sp=mem_access_kernel_1.hbm_ptr_2:HBM[1]
sp=mem_access_kernel_1.pos_pma_addrs:HBM[29]

sp=alloc_access_kernel_1.bm_in_hbm_1:HBM[20]
sp=alloc_access_kernel_1.bm_in_hbm_2:HBM[21]
# sp=pma_insert_edge_1.pos_pma_addrs_write:HBM[29]
# sp=pma_insert_edge_1.neg_pma_addrs_write:HBM[28]
# sp=pma_insert_edge_2.pos_pma_addrs_write:HBM[29]
# sp=pma_insert_edge_2.neg_pma_addrs_write:HBM[28]


sp=update_message_generator_1.src:HBM[30]
sp=update_message_generator_1.dst:HBM[31]
# sp=update_message_generator_1.src_to_change:HBM[27]
# sp=update_message_generator_1.attr_to_change:HBM[26]
# sp=pma_update_kernel_1.pos_pma_addrs:HBM[29]
# sp=pma_update_kernel_1.neg_pma_addrs:HBM[28]
# sp=pma_update_kernel_2.pos_pma_addrs:HBM[29]
# sp=pma_update_kernel_2.neg_pma_addrs:HBM[28]
# Stream Connections from memkernel/connectivity.cfg

stream_connect=pma_insert_vertex_1.req_to_mem_alloc:alloc_access_kernel_1.req_from_vertex_1:16
stream_connect=alloc_access_kernel_1.vec_info_to_vertex_1:pma_insert_vertex_1.vec_info_back_stream:16
stream_connect=pma_insert_vertex_2.req_to_mem_alloc:alloc_access_kernel_1.req_from_vertex_2:16
stream_connect=alloc_access_kernel_1.vec_info_to_vertex_2:pma_insert_vertex_2.vec_info_back_stream:16

stream_connect=pma_insert_edge_1.req_to_mem_alloc:alloc_access_kernel_1.req_from_edge_1:16
stream_connect=alloc_access_kernel_1.vec_info_to_edge_1:pma_insert_edge_1.vec_info_back_stream:16
stream_connect=pma_insert_edge_2.req_to_mem_alloc:alloc_access_kernel_1.req_from_edge_2:16
stream_connect=alloc_access_kernel_1.vec_info_to_edge_2:pma_insert_edge_2.vec_info_back_stream:16

# Mem Access Kernel Connections
stream_connect=pma_insert_vertex_1.req_to_mem_access:mem_access_kernel_1.req_from_vertex_1:16
stream_connect=pma_insert_vertex_1.data_to_mem_access:mem_access_kernel_1.data_from_vertex_1:16
stream_connect=pma_insert_vertex_2.req_to_mem_access:mem_access_kernel_1.req_from_vertex_2:16
stream_connect=pma_insert_vertex_2.data_to_mem_access:mem_access_kernel_1.data_from_vertex_2:16

stream_connect=pma_insert_edge_1.req_to_mem_access:mem_access_kernel_1.req_from_edge_1:16
stream_connect=pma_insert_edge_1.data_to_mem_access:mem_access_kernel_1.data_from_edge_1:16
stream_connect=mem_access_kernel_1.data_to_edge_1:pma_insert_edge_1.data_from_mem_access:16
stream_connect=mem_access_kernel_1.vec_info_to_edge_1:pma_insert_edge_1.vec_info_from_mem_access:16
stream_connect=pma_insert_edge_2.req_to_mem_access:mem_access_kernel_1.req_from_edge_2:16
stream_connect=pma_insert_edge_2.data_to_mem_access:mem_access_kernel_1.data_from_edge_2:16
stream_connect=mem_access_kernel_1.data_to_edge_2:pma_insert_edge_2.data_from_mem_access:16
stream_connect=mem_access_kernel_1.vec_info_to_edge_2:pma_insert_edge_2.vec_info_from_mem_access:16
stream_connect=pma_read_kernel_1.req_to_mem_access_ch1:mem_access_kernel_1.req_from_read_1:16
stream_connect=pma_read_kernel_1.req_to_mem_access_ch2:mem_access_kernel_1.req_from_read_2:16
stream_connect=mem_access_kernel_1.data_to_read_1:pma_read_kernel_1.data_from_mem_access_ch1:16
stream_connect=mem_access_kernel_1.data_to_read_2:pma_read_kernel_1.data_from_mem_access_ch2:16
stream_connect=mem_access_kernel_1.vec_info_to_read_1:pma_read_kernel_1.vec_info_back_stream_ch1:16
stream_connect=mem_access_kernel_1.vec_info_to_read_2:pma_read_kernel_1.vec_info_back_stream_ch2:16
stream_connect=signal_kernel_1.signal_to_mem_access:mem_access_kernel_1.signal_stream:16

# ReGraph edge reader connections
stream_connect=edge_reader_1.little_cmd_stm:pma_read_kernel_1.cmd_stream:16


stream_connect=update_message_router_1.cmd_to_insert_vertex_1:pma_insert_vertex_1.cmd_stream:16
stream_connect=update_message_router_1.cmd_to_insert_vertex_2:pma_insert_vertex_2.cmd_stream:16
stream_connect=pma_insert_vertex_1.ack_back_to_router:update_message_router_1.ack_from_insert_vertex_1:16
stream_connect=pma_insert_vertex_2.ack_back_to_router:update_message_router_1.ack_from_insert_vertex_2:16

stream_connect=update_message_router_1.cmd_to_insert_edge_1:pma_insert_edge_1.cmd_stream:16
stream_connect=update_message_router_1.cmd_to_insert_edge_2:pma_insert_edge_2.cmd_stream:16
stream_connect=pma_insert_edge_1.ack_back_to_router:update_message_router_1.ack_from_insert_edge_1:16
stream_connect=pma_insert_edge_2.ack_back_to_router:update_message_router_1.ack_from_insert_edge_2:16


stream_connect=signal_kernel_1.signal_to_alloc_free:alloc_access_kernel_1.signal_stream:16
# alloc_access_kernel broadcasts control internally; only one signal stream is connected.




stream_connect=update_message_generator_1.cmd_to_router:update_message_router_1.cmd_from_generator:64  
stream_connect=update_message_router_1.ack_to_generator:update_message_generator_1.ack_from_router:16
# stream_connect=update_message_router_1.cmd_to_pma_1:pma_update_kernel_1.cmd_stream:16  
# stream_connect=update_message_router_1.cmd_to_pma_2:pma_update_kernel_2.cmd_stream:16
# Stream Connections from system_connect.cfg

# REGRAPH_LITTLE_KERNEL_ID_TEXT REGRAPH_LITTLE_KERNEL_ID_TEXT
# REGRAPH_LITTLE_KERNEL_ID_TEXT REGRAPH_LITTLE_KERNEL_ID_TEXT
# REGRAPH_LITTLE_KERNEL_ID_TEXT REGRAPH_LITTLE_KERNEL_ID_TEXT

# REGRAPH_BIG_KERNEL_ID_TEXT REGRAPH_BIG_KERNEL_ID_TEXT
# REGRAPH_BIG_KERNEL_ID_TEXT REGRAPH_BIG_KERNEL_ID_TEXT
# REGRAPH_BIG_KERNEL_ID_TEXT REGRAPH_BIG_KERNEL_ID_TEXT

# REGRAPH_ALL_KERNEL_ID_TEXT REGRAPH_APPLY_KERNEL_HBM_ID

# REGRAPH_LITTLE_KERNEL_NUM
# REGRAPH_LITTLE_KERNEL_ID_TEXT REGRAPH_LITTLE_KERNEL_HBM_ID
# REGRAPH_LITTLE_KERNEL_ID_TEXT REGRAPH_LITTLE_KERNEL_SLR_ID

# REGRAPH_BIG_KERNEL_NUM
# REGRAPH_BIG_KERNEL_ID_TEXT REGRAPH_BIG_KERNEL_HBM_ID
# REGRAPH_BIG_KERNEL_ID_TEXT REGRAPH_BIG_KERNEL_SLR_ID


# --------------------------------------------------------------------------------------------------------------------#
#                          Little Gather Scatter Merger Kernel <=> Little Scatter Gather Kernel                       #
# --------------------------------------------------------------------------------------------------------------------#

stream_connect=edgeReader_1.little_edge_burst_stm:littleKernelScatterGather_1.part_edge_burst_stm:16
stream_connect=edgeReader_1.little_edge_num_stm:littleKernelScatterGather_1.part_edge_num_stm:16

stream_connect=littleKernelScatterGather_1.l_ppb_request_stm:kernelHBMWrapper_1.l_ppb_request_stm_1 

stream_connect=kernelHBMWrapper_1.l_ppb_response_stm_1:littleKernelScatterGather_1.l_ppb_response_stm 

stream_connect=littleKernelScatterGather_1.l_tmp_prop_stm:kernelLittleGSMerger_1.l_tmp_prop_stm_1:16

# --------------------------------------------------------------------------------------------------------------------#
#                            Big Gather Scatter Merger Kernel <=> Big Scatter Gather Kernel                           #
# --------------------------------------------------------------------------------------------------------------------#

stream_connect=edgeReader_1.big_edge_burst_stm:bigKernelScatterGather_1.part_edge_burst_stm:16
stream_connect=edgeReader_1.big_edge_num_stm:bigKernelScatterGather_1.part_edge_num_stm:16

stream_connect=bigKernelScatterGather_1.b_cacheline_request_stm:kernelHBMWrapper_1.b_cacheline_request_stm_1:16

stream_connect=kernelHBMWrapper_1.b_cacheline_response_stm_1:bigKernelScatterGather_1.b_cacheline_response_stm:16

stream_connect=bigKernelScatterGather_1.b_tmp_prop_stm:kernelBigGSMerger_1.b_tmp_prop_stm_1 

# ---------------------------------------------------------------------------------------------------#
#               Little / Big Gather Scatter Merger Kernel <=> Merge Apply Write Kernel               #
# ---------------------------------------------------------------------------------------------------#

stream_connect=kernelLittleGSMerger_1.l_write_burst_stm:kernelApply_1.l_merged_prop_stm:16
stream_connect=kernelBigGSMerger_1.b_write_burst_stm:kernelApply_1.b_merged_prop_stm:16

# ---------------------------------------------------------------------------------------------------#
#                                     Apply Kernel <=> HBM Wrapper                                   #
# ---------------------------------------------------------------------------------------------------#

stream_connect=kernelApply_1.prop_write_burst_stm:kernelHBMWrapper_1.prop_write_burst_stm:16

# -----------------------------------------------------#
#                     Merger  Kernels                  #
# -----------------------------------------------------#

nk=kernelLittleGSMerger:1
slr=kernelLittleGSMerger_1:SLR1

nk=kernelBigGSMerger:1
slr=kernelBigGSMerger_1:SLR1

# -----------------------------------------------------#
#                     Edge Reader                      #
# -----------------------------------------------------#

nk=edgeReader:1
slr=edgeReader_1:SLR0

# -----------------------------------------------------#
#                      Apply  Kernel                   #
# -----------------------------------------------------#

nk=kernelApply:1



slr=kernelApply_1:SLR1


# -----------------------------------------------------#
#                       HBM Wrapper                    #
# -----------------------------------------------------#

nk=kernelHBMWrapper:1

sp=kernelHBMWrapper_1.src_prop_1:HBM[1]
sp=kernelHBMWrapper_1.src_prop_2:HBM[3]

sp=kernelHBMWrapper_1.new_prop_1:HBM[1]
sp=kernelHBMWrapper_1.new_prop_2:HBM[3]

slr=kernelHBMWrapper_1:SLR0


# -----------------------------------------------------#
#             Little Scatter Gather Kernel             #
# -----------------------------------------------------#

nk=littleKernelScatterGather:1

slr=littleKernelScatterGather_1:SLR0


# -----------------------------------------------------#
#              Big Scatter Gather Kernel               #
# -----------------------------------------------------#

nk=bigKernelScatterGather:1

slr=bigKernelScatterGather_1:SLR1

