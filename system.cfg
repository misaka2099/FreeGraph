[connectivity]

nk=update_message_generator:1:update_message_generator_1
nk=update_message_router:1:update_message_router_1
nk=bs_kernel:1:bs_kernel_1
nk=insert_kernel:1:insert_kernel_1
nk=rebalance_kernel:1:rebalance_kernel_1
nk=pma_read_kernel:1:pma_read_kernel_1
nk=check_kernel:1:check_kernel_1

# SLR placement
slr=update_message_generator_1:SLR0
slr=update_message_router_1:SLR0
slr=bs_kernel_1:SLR0
slr=insert_kernel_1:SLR1
slr=rebalance_kernel_1:SLR1
slr=pma_read_kernel_1:SLR0
slr=check_kernel_1:SLR0

# HBM mapping
sp=bs_kernel_1.hbm_ptr_0:HBM[0]
sp=bs_kernel_1.hbm_ptr_1:HBM[1]

sp=insert_kernel_1.hbm_ptr_0:HBM[0]
sp=insert_kernel_1.hbm_ptr_1:HBM[1]

sp=rebalance_kernel_1.hbm_ptr_0:HBM[0]
sp=rebalance_kernel_1.hbm_ptr_1:HBM[1]

sp=pma_read_kernel_1.hbm_ptr_0:HBM[0]
sp=pma_read_kernel_1.hbm_ptr_1:HBM[1]

sp=update_message_generator_1.src:HBM[30]
sp=update_message_generator_1.dst:HBM[31]
sp=check_kernel_1.coo_src:HBM[24]
sp=check_kernel_1.coo_dst:HBM[25]
sp=check_kernel_1.num_edges:HBM[19]

# -------------------------------------------------------
# Insert pipeline: generator → router → bs → insert
# -------------------------------------------------------
stream_connect=update_message_generator_1.cmd_to_router:update_message_router_1.cmd_from_generator:64
stream_connect=update_message_router_1.ack_to_generator:update_message_generator_1.ack_from_router:16

stream_connect=update_message_router_1.cmd_to_bs:bs_kernel_1.cmd_stream:16

stream_connect=bs_kernel_1.to_insert:insert_kernel_1.cmd_stream:16

stream_connect=insert_kernel_1.reprocess_out:update_message_router_1.reprocess_in:16
stream_connect=insert_kernel_1.rebalance_out:rebalance_kernel_1.rebalance_req_stream:16

# -------------------------------------------------------
# Read pipeline: check → pma_read_kernel → check
# -------------------------------------------------------
stream_connect=check_kernel_1.cmd_to_read:pma_read_kernel_1.cmd_stream:16
stream_connect=pma_read_kernel_1.data_to_coo_stream:check_kernel_1.data_to_coo_stream:16
stream_connect=pma_read_kernel_1.coo_edge_count_stream:check_kernel_1.edge_count_stream:16

[vivado]
prop=fileset.sim_1.xsim.elaborate.debug_level=all
