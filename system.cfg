[connectivity]

nk=pma_insert_edge:4:pma_insert_edge_1,pma_insert_edge_2,pma_insert_edge_3,pma_insert_edge_4
nk=update_message_generator:1:update_message_generator_1
nk=update_message_router:1:update_message_router_1
nk=pma_read_router_kernel:1:pma_read_router_kernel_1
nk=pma_read_worker_kernel:4:pma_read_worker_kernel_1,pma_read_worker_kernel_2,pma_read_worker_kernel_3,pma_read_worker_kernel_4
nk=pma_read_merger_kernel:1:pma_read_merger_kernel_1
nk=check_kernel:1:check_kernel_1
nk=alloc_access_kernel:4:alloc_access_kernel_1,alloc_access_kernel_2,alloc_access_kernel_3,alloc_access_kernel_4

# SLR placement
# Each SLR gets 1 insert_edge (+ its alloc + read_worker).
# SLR1 gets insert_edge_2 AND insert_edge_3 (2 instances) because
# shared kernels (router/merger/gen/check) are on SLR0, leaving SLR1
# with more free BRAM than SLR0.
slr=pma_insert_edge_1:SLR0
slr=pma_insert_edge_2:SLR1
slr=pma_insert_edge_3:SLR1
slr=pma_insert_edge_4:SLR2
slr=pma_read_worker_kernel_1:SLR0
slr=pma_read_worker_kernel_2:SLR1
slr=pma_read_worker_kernel_3:SLR1
slr=pma_read_worker_kernel_4:SLR2
slr=update_message_generator_1:SLR0
slr=update_message_router_1:SLR0
slr=pma_read_router_kernel_1:SLR0
slr=pma_read_merger_kernel_1:SLR0
slr=check_kernel_1:SLR0
slr=alloc_access_kernel_1:SLR0
slr=alloc_access_kernel_2:SLR1
slr=alloc_access_kernel_3:SLR1
slr=alloc_access_kernel_4:SLR2

# ---- HBM mapping ----
# pma_insert_edge: 4 m_axi ports per instance
sp=pma_insert_edge_1.hbm_gate:HBM[0]
sp=pma_insert_edge_1.hbm_bs:HBM[0]
sp=pma_insert_edge_1.hbm_rw:HBM[0]
sp=pma_insert_edge_1.hbm_red:HBM[0]

sp=pma_insert_edge_2.hbm_gate:HBM[1]
sp=pma_insert_edge_2.hbm_bs:HBM[1]
sp=pma_insert_edge_2.hbm_rw:HBM[1]
sp=pma_insert_edge_2.hbm_red:HBM[1]

sp=pma_insert_edge_3.hbm_gate:HBM[2]
sp=pma_insert_edge_3.hbm_bs:HBM[2]
sp=pma_insert_edge_3.hbm_rw:HBM[2]
sp=pma_insert_edge_3.hbm_red:HBM[2]

sp=pma_insert_edge_4.hbm_gate:HBM[3]
sp=pma_insert_edge_4.hbm_bs:HBM[3]
sp=pma_insert_edge_4.hbm_rw:HBM[3]
sp=pma_insert_edge_4.hbm_red:HBM[3]

# Read workers: direct m_axi, one port each — must match insert_edge bank per channel
sp=pma_read_worker_kernel_1.hbm_ptr:HBM[0]
sp=pma_read_worker_kernel_2.hbm_ptr:HBM[1]
sp=pma_read_worker_kernel_3.hbm_ptr:HBM[2]
sp=pma_read_worker_kernel_4.hbm_ptr:HBM[3]

# Generator / Check HBM ports
sp=update_message_generator_1.src:HBM[30]
sp=update_message_generator_1.dst:HBM[31]
sp=check_kernel_1.coo_src:HBM[24]
sp=check_kernel_1.coo_dst:HBM[25]
sp=check_kernel_1.num_edges:HBM[19]

# Read merger: m_axi for edge count output
sp=pma_read_merger_kernel_1.edge_count_ptr:HBM[19]

# alloc_access: bitmap allocator (separate bitmap BO)
sp=alloc_access_kernel_1.bm_in_hbm:HBM[0]
sp=alloc_access_kernel_2.bm_in_hbm:HBM[1]
sp=alloc_access_kernel_3.bm_in_hbm:HBM[2]
sp=alloc_access_kernel_4.bm_in_hbm:HBM[3]

# ---- Stream connections ----

# Update pipeline
stream_connect=update_message_generator_1.cmd_to_router:update_message_router_1.cmd_from_generator:64
stream_connect=update_message_router_1.ack_to_generator:update_message_generator_1.ack_from_router:16

stream_connect=update_message_router_1.cmd_to_insert_edge_1:pma_insert_edge_1.cmd_stream:16
stream_connect=update_message_router_1.cmd_to_insert_edge_2:pma_insert_edge_2.cmd_stream:16
stream_connect=update_message_router_1.cmd_to_insert_edge_3:pma_insert_edge_3.cmd_stream:16
stream_connect=update_message_router_1.cmd_to_insert_edge_4:pma_insert_edge_4.cmd_stream:16
stream_connect=pma_insert_edge_1.ack_back_to_router:update_message_router_1.ack_from_insert_edge_1:16
stream_connect=pma_insert_edge_2.ack_back_to_router:update_message_router_1.ack_from_insert_edge_2:16
stream_connect=pma_insert_edge_3.ack_back_to_router:update_message_router_1.ack_from_insert_edge_3:16
stream_connect=pma_insert_edge_4.ack_back_to_router:update_message_router_1.ack_from_insert_edge_4:16

# alloc_access ↔ insert_edge (per channel)
stream_connect=pma_insert_edge_1.alloc_cmd_stream:alloc_access_kernel_1.cmd_stream:16
stream_connect=alloc_access_kernel_1.rsp_stream:pma_insert_edge_1.alloc_rsp_stream:16
stream_connect=pma_insert_edge_2.alloc_cmd_stream:alloc_access_kernel_2.cmd_stream:16
stream_connect=alloc_access_kernel_2.rsp_stream:pma_insert_edge_2.alloc_rsp_stream:16
stream_connect=pma_insert_edge_3.alloc_cmd_stream:alloc_access_kernel_3.cmd_stream:16
stream_connect=alloc_access_kernel_3.rsp_stream:pma_insert_edge_3.alloc_rsp_stream:16
stream_connect=pma_insert_edge_4.alloc_cmd_stream:alloc_access_kernel_4.cmd_stream:16
stream_connect=alloc_access_kernel_4.rsp_stream:pma_insert_edge_4.alloc_rsp_stream:16

# Read/check pipeline
stream_connect=check_kernel_1.cmd_to_read:pma_read_router_kernel_1.cmd_in:16
stream_connect=pma_read_router_kernel_1.worker_cmd_0:pma_read_worker_kernel_1.cmd_stream:16
stream_connect=pma_read_router_kernel_1.worker_cmd_1:pma_read_worker_kernel_2.cmd_stream:16
stream_connect=pma_read_router_kernel_1.worker_cmd_2:pma_read_worker_kernel_3.cmd_stream:16
stream_connect=pma_read_router_kernel_1.worker_cmd_3:pma_read_worker_kernel_4.cmd_stream:16
stream_connect=pma_read_router_kernel_1.merger_cmd:pma_read_merger_kernel_1.merger_cmd_stream:16
stream_connect=pma_read_worker_kernel_1.pkt_to_merger:pma_read_merger_kernel_1.worker0_pkt_stream:128
stream_connect=pma_read_worker_kernel_2.pkt_to_merger:pma_read_merger_kernel_1.worker1_pkt_stream:128
stream_connect=pma_read_worker_kernel_3.pkt_to_merger:pma_read_merger_kernel_1.worker2_pkt_stream:128
stream_connect=pma_read_worker_kernel_4.pkt_to_merger:pma_read_merger_kernel_1.worker3_pkt_stream:128
stream_connect=pma_read_merger_kernel_1.data_to_coo_stream:check_kernel_1.data_to_coo_stream:16

