[connectivity]
# Kernel Declarations from all files
nk=allocate_kernel:1:allocate_kernel_1
nk=free_kernel:1:free_kernel_1
nk=app_mem_middle_ware:1:app_mem_middle_ware_1
nk=pma_update_kernel:2:pma_update_kernel_1,pma_update_kernel_2
nk=update_message_generator:1:update_message_generator_1
nk=update_message_router:1:update_message_router_1
nk=pma_read_kernel:1:pma_read_kernel_1
nk=check_kernel:1:check_kernel_1
nk=stop_kernel:1:stop_kernel_1
# SP Declarations from all files
sp=allocate_kernel_1.bm_ptr:HBM[0]
sp=free_kernel_1.bm_ptr:HBM[0]
sp=pma_update_kernel_1.hbm_ptr:HBM[1:2]
sp=pma_update_kernel_2.hbm_ptr:HBM[1:2]
sp=pma_read_kernel_1.hbm_ptr:HBM[1:2]
sp=update_message_generator_1.src:HBM[30]
sp=update_message_generator_1.dst:HBM[31]
sp=update_message_generator_1.src_to_change:HBM[27]
sp=update_message_generator_1.attr_to_change:HBM[26]
sp=pma_update_kernel_1.pos_pma_addrs:HBM[29]
sp=pma_update_kernel_1.neg_pma_addrs:HBM[28]
sp=pma_update_kernel_2.pos_pma_addrs:HBM[29]
sp=pma_update_kernel_2.neg_pma_addrs:HBM[28]
sp=pma_read_kernel_1.pos_pma_addrs:HBM[29]
sp=pma_read_kernel_1.neg_pma_addrs:HBM[28]
sp=check_kernel_1.src:HBM[3]
sp=check_kernel_1.dst:HBM[3]
sp=check_kernel_1.vertex_attr:HBM[4]

# Stream Connections from memkernel/connectivity.cfg
stream_connect=app_mem_middle_ware_1.vec_info_to_alloc:allocate_kernel_1.vec_info_stream:512
stream_connect=allocate_kernel_1.vec_info_back:app_mem_middle_ware_1.vec_info_from_mem:512
stream_connect=app_mem_middle_ware_1.vec_info_to_free:free_kernel_1.vec_info_stream:512
# Stream Connections from pma_kernel/connectivity.cfg
stream_connect=update_message_generator_1.cmd_to_router:update_message_router_1.cmd_from_generator:512  
# stream_connect=update_message_generator_1.clear_message_to_router:update_message_router_1.clear_message_from_generator  
stream_connect=update_message_router_1.cmd_to_pma_1:pma_update_kernel_1.cmd_stream:512  
stream_connect=update_message_router_1.cmd_to_pma_2:pma_update_kernel_2.cmd_stream:512
stream_connect=pma_update_kernel_1.ack_back_to_router:update_message_router_1.ack_from_pma_1:512  
stream_connect=pma_update_kernel_2.ack_back_to_router:update_message_router_1.ack_from_pma_2:512

stream_connect=check_kernel_1.cmd_to_read:pma_read_kernel_1.cmd_stream:512  
stream_connect=pma_read_kernel_1.data_to_nei_query:check_kernel_1.data_to_check:512  
stream_connect=pma_read_kernel_1.data_to_attr_query:check_kernel_1.attr_to_check:512  
stream_connect=stop_kernel_1.stop_signal_to_mem:app_mem_middle_ware_1.stop_signal:512
# Stream Connections from system_connect.cfg


stream_connect=pma_update_kernel_1.vec_info_stream:app_mem_middle_ware_1.vec_info_from_app_1:512
stream_connect=app_mem_middle_ware_1.vec_info_to_app_1:pma_update_kernel_1.pma_addr_back_stream:512
stream_connect=pma_update_kernel_1.cmd_to_mem_stream:app_mem_middle_ware_1.cmd_from_app_1:512


stream_connect=pma_update_kernel_2.vec_info_stream:app_mem_middle_ware_1.vec_info_from_app_2:512
stream_connect=app_mem_middle_ware_1.vec_info_to_app_2:pma_update_kernel_2.pma_addr_back_stream:512
stream_connect=pma_update_kernel_2.cmd_to_mem_stream:app_mem_middle_ware_1.cmd_from_app_2:512
