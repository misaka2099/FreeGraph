[connectivity]
# Kernel Declarations from all files
nk=read_kernel:2:read_kernel_1,read_kernel_2
nk=write_kernel:2:write_kernel_1,write_kernel_2
nk=allocate_kernel:1:allocate_kernel_1
nk=free_kernel:1:free_kernel_1
nk=write_mux:1:write_mux_1
nk=read_mux:1:read_mux_1
nk=memlock:1:memlock_1
nk=app_mem_middle_ware:1:app_mem_middle_ware_1
nk=pma_update_kernel:1:pma_update_kernel_1
nk=update_message_generator:1:update_message_generator_1
nk=update_message_router:1:update_message_router_1
nk=pma_read_kernel:1:pma_read_kernel_1
nk=check_kernel:1:check_kernel_1

# SP Declarations from all files
sp=write_kernel_1.hbm_ptr:HBM[0]
sp=write_kernel_2.hbm_ptr:HBM[1]
sp=read_kernel_1.hbm_ptr:HBM[0]
sp=read_kernel_2.hbm_ptr:HBM[1]
sp=allocate_kernel_1.bm_ptr:HBM[2]
sp=free_kernel_1.bm_ptr:HBM[2]
sp=update_message_generator_1.src:HBM[30]
sp=update_message_generator_1.dst:HBM[31]
sp=update_message_generator_1.src_to_change:HBM[27]
sp=update_message_generator_1.attr_to_change:HBM[26]
sp=pma_update_kernel_1.pos_pma_addrs:HBM[29]
sp=pma_update_kernel_1.neg_pma_addrs:HBM[28]
sp=pma_read_kernel.pos_pma_addrs:HBM[29]
sp=pma_read_kernel.neg_pma_addrs:HBM[28]

sp=check_kernel_1.src:HBM[3]
sp=check_kernel_1.dst:HBM[3]
sp=check_kernel_1.vertex_attr:HBM[4]

# Stream Connections from memkernel/connectivity.cfg
stream_connect=memlock_1.vec_to_write_stream:write_mux_1.vec_info_stream  
stream_connect=memlock_1.vec_to_read_stream:read_mux_1.vec_info_stream  
stream_connect=memlock_1.vec_to_alloc_stream:allocate_kernel_1.vec_info_stream  
stream_connect=memlock_1.vec_to_free_stream:free_kernel_1.vec_info_stream  
stream_connect=write_mux_1.vec_info_to_mem_1:write_kernel_1.vec_info_in  
stream_connect=write_mux_1.data_to_mem_1:write_kernel_1.data_in  
stream_connect=write_mux_1.vec_info_to_mem_2:write_kernel_2.vec_info_in  
stream_connect=write_mux_1.data_to_mem_2:write_kernel_2.data_in  
stream_connect=read_mux_1.tag_vecinfo_to_mem_1:read_kernel_1.tag_vec_info_in  
stream_connect=read_mux_1.tag_vecinfo_to_mem_2:read_kernel_2.tag_vec_info_in  
stream_connect=read_kernel_1.data_out:read_mux_1.data_from_mem_1  
stream_connect=read_kernel_2.data_out:read_mux_1.data_from_mem_2  
stream_connect=write_kernel_1.ack_back_to_scheduler:write_mux_1.ack_from_mem_1  
stream_connect=write_kernel_2.ack_back_to_scheduler:write_mux_1.ack_from_mem_2  
stream_connect=read_kernel_1.ack_back_to_scheduler:read_mux_1.ack_from_mem_1  
stream_connect=read_kernel_2.ack_back_to_scheduler:read_mux_1.ack_from_mem_2  
stream_connect=write_mux_1.ack_to_scheduler:memlock_1.ack_write_stream  
stream_connect=read_mux_1.ack_to_scheduler:memlock_1.ack_read_stream  
stream_connect=allocate_kernel_1.ack_stream:memlock_1.ack_alloc_stream  
stream_connect=free_kernel_1.ack_stream:memlock_1.ack_free_stream  
stream_connect=app_mem_middle_ware_1.cmd_to_mem:memlock_1.cmd_stream  
stream_connect=app_mem_middle_ware_1.data_to_mem:write_mux_1.data_from_app  
stream_connect=allocate_kernel_1.vec_info_back:app_mem_middle_ware_1.vec_info_from_mem  
stream_connect=app_mem_middle_ware_1.vec_info_to_mem:memlock_1.vec_info_stream  
stream_connect=read_mux_1.data_to_app:app_mem_middle_ware_1.data_from_mem  

# Stream Connections from pma_kernel/connectivity.cfg
stream_connect=update_message_generator_1.cmd_to_router:update_message_router_1.cmd_from_generator  
# stream_connect=update_message_generator_1.clear_message_to_router:update_message_router_1.clear_message_from_generator  
stream_connect=update_message_router_1.cmd_to_pma:pma_update_kernel_1.cmd_stream  
stream_connect=check_kernel_1.cmd_to_read:pma_read_kernel_1.cmd_stream  
stream_connect=pma_read_kernel_1.data_to_nei_query:check_kernel_1.data_to_check  
stream_connect=pma_read_kernel_1.data_to_attr_query:check_kernel_1.attr_to_check  

# Stream Connections from system_connect.cfg
stream_connect=pma_update_kernel_1.cmd_to_mem_stream:app_mem_middle_ware_1.cmd_from_app_1  
stream_connect=pma_update_kernel_1.vec_info_stream:app_mem_middle_ware_1.vec_info_from_app_1  
stream_connect=app_mem_middle_ware_1.vec_info_to_app_1:pma_update_kernel_1.pma_addr_back_stream  
stream_connect=pma_update_kernel_1.data_to_mem_stream:app_mem_middle_ware_1.data_from_app_1  
stream_connect=app_mem_middle_ware_1.data_to_app_1:pma_update_kernel_1.data_from_mem_stream  
stream_connect=pma_read_kernel_1.cmd_to_mem_stream:app_mem_middle_ware_1.cmd_from_app_2  
stream_connect=pma_read_kernel_1.vec_info_stream:app_mem_middle_ware_1.vec_info_from_app_2  
stream_connect=app_mem_middle_ware_1.vec_info_to_app_2:pma_read_kernel_1.vec_info_from_mem  
stream_connect=pma_read_kernel_1.data_to_mem_stream:app_mem_middle_ware_1.data_from_app_2  
stream_connect=app_mem_middle_ware_1.data_to_app_2:pma_read_kernel_1.data_from_mem_stream  
