# overlap_test.cfg — connectivity for HBM read/write concurrency test.
# Write path:  update_message_generator → router → pma_insert_edge → mem_access
# Read path:   overlap_reader → mem_access_kernel (req_from_read)
# Host guarantees: update PMA ≠ read PMA.

[connectivity]

nk=update_message_generator:1:update_message_generator_1
nk=update_message_router:1:update_message_router_1
nk=pma_insert_edge:1:pma_insert_edge_1
nk=overlap_reader:1:overlap_reader_1
nk=mem_access_kernel:1:mem_access_kernel_1
nk=alloc_access_kernel:1:alloc_access_kernel_1

slr=update_message_generator_1:SLR0
slr=update_message_router_1:SLR0
slr=pma_insert_edge_1:SLR0
slr=overlap_reader_1:SLR0
slr=mem_access_kernel_1:SLR0
slr=alloc_access_kernel_1:SLR1

# HBM
sp=mem_access_kernel_1.hbm_ptr:HBM[0:1]
sp=mem_access_kernel_1.pma_addrs:HBM[2]
sp=alloc_access_kernel_1.bm_in_hbm:HBM[20]
sp=update_message_generator_1.src:HBM[30]
sp=update_message_generator_1.dst:HBM[31]

# Update pipeline
stream_connect=update_message_generator_1.cmd_to_router:update_message_router_1.cmd_from_generator:64
stream_connect=update_message_router_1.ack_to_generator:update_message_generator_1.ack_from_router:16
stream_connect=update_message_router_1.cmd_to_insert_edge_1:pma_insert_edge_1.cmd_stream:16
stream_connect=pma_insert_edge_1.ack_back_to_router:update_message_router_1.ack_from_insert_edge_1:16

# Insert_edge <-> alloc
stream_connect=pma_insert_edge_1.req_to_mem_alloc:alloc_access_kernel_1.req_from_edge:16
stream_connect=alloc_access_kernel_1.vec_info_to_edge:pma_insert_edge_1.vec_info_back_stream:16

# Insert_edge <-> mem_access (req_from_edge)
stream_connect=pma_insert_edge_1.req_to_mem_access:mem_access_kernel_1.req_from_edge:16
stream_connect=pma_insert_edge_1.data_to_mem_access:mem_access_kernel_1.data_from_edge:16
stream_connect=mem_access_kernel_1.data_to_edge:pma_insert_edge_1.data_from_mem_access:16

# overlap_reader <-> mem_access (req_from_read)
stream_connect=overlap_reader_1.req_to_mem:mem_access_kernel_1.req_from_read:16
stream_connect=mem_access_kernel_1.data_to_read:overlap_reader_1.data_from_mem:16

# Alloc <-> mem
stream_connect=mem_access_kernel_1.req_to_alloc:alloc_access_kernel_1.req_from_mem:16
stream_connect=alloc_access_kernel_1.resp_to_mem:mem_access_kernel_1.resp_from_alloc:16

[vivado]
prop=fileset.sim_1.xsim.elaborate.debug_level=all
