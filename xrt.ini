[Debug]
native_xrt_trace = false
device_trace = off
# 无波形构建 (-g 去掉) 后死锁检测 IP 不在, 需关闭; 死锁已修复 (write_nb+自旋)。
pl_deadlock_detection = false
stall_trace = off
continuous_trace = false
profile_api = false
sc_profile = false
xrt_trace = false

[Runtime]
runtime_log = console

[Emulation]
# 无 GUI: batch 模式, 避免 xsim GUI 挂起
debug_mode = gui
aliveness_message_interval = 300
