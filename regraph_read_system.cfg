# regraph_read_system.cfg — 读管线 + ReGraph 计算核集成系统
#
# 内核集合 (不含 router/merger/insert/check — edgeReader 直接驱动 3 个读 worker):
#   pma_read_worker_kernel × 3    读管线 (直接 m_axi 访问 HBM)
#   edgeReader                    命令生成 + 3 路 worker 流合并 + COO → edge burst 转换
#   littleKernelScatterGather × 1 ReGraph GS 计算核
#   kernelLittleGSMerger × 1      合并 GS 结果
#   kernelApply × 1               apply 阶段, 写 vertex_prop
#   kernelHBMWrapper × 1          src 属性读取 (ppb) + new_prop 写回
#
# 流拓扑:
#   edgeReader --cmd--> 3 × pma_read_worker (广播)
#   3 × pma_read_worker --pkt--> edgeReader (edgeReader 内部按 PMA 轮转合并)
#   edgeReader --edge burst/count--> littleKernelScatterGather
#   littleKernelScatterGather --tmp_prop--> kernelLittleGSMerger
#   kernelLittleGSMerger --write_burst--> kernelApply
#   kernelApply --prop_write_burst--> kernelHBMWrapper
#   littleKernelScatterGather <--ppb--> kernelHBMWrapper

[connectivity]

nk=pma_read_worker_kernel:3:pma_read_worker_kernel_1,pma_read_worker_kernel_2,pma_read_worker_kernel_3
nk=edgeReader:1:edgeReader_1
nk=littleKernelScatterGather:1:littleKernelScatterGather_1
nk=kernelLittleGSMerger:1:kernelLittleGSMerger_1
nk=kernelApply:1:kernelApply_1
nk=kernelHBMWrapper:1:kernelHBMWrapper_1

# ---- SLR placement ----
slr=pma_read_worker_kernel_1:SLR0
slr=pma_read_worker_kernel_2:SLR1
slr=pma_read_worker_kernel_3:SLR2
slr=edgeReader_1:SLR0
slr=littleKernelScatterGather_1:SLR0
slr=kernelLittleGSMerger_1:SLR0
slr=kernelApply_1:SLR0
slr=kernelHBMWrapper_1:SLR0

# ---- HBM mapping ----
# 读 worker: 每通道一个 HBM bank (与 host 的 ch_bufs 对应)
sp=pma_read_worker_kernel_1.hbm_ptr:HBM[0]
sp=pma_read_worker_kernel_2.hbm_ptr:HBM[1]
sp=pma_read_worker_kernel_3.hbm_ptr:HBM[2]

# edgeReader: 边计数回写 (host 验证用)
sp=edgeReader_1.edge_count_out:HBM[9]

# ReGraph 顶点属性 (BFS dist): 65536 vertices = 256KB
sp=kernelHBMWrapper_1.src_prop_1:HBM[10]
sp=kernelHBMWrapper_1.new_prop_1:HBM[10]
sp=kernelApply_1.vertex_prop:HBM[11]

# ---- Stream connections ----
# 读管线: edgeReader 直接驱动 3 个 worker (无 router, 无 merger)
stream_connect=edgeReader_1.worker_cmd_0:pma_read_worker_kernel_1.cmd_stream:16
stream_connect=edgeReader_1.worker_cmd_1:pma_read_worker_kernel_2.cmd_stream:16
stream_connect=edgeReader_1.worker_cmd_2:pma_read_worker_kernel_3.cmd_stream:16
stream_connect=pma_read_worker_kernel_1.pkt_to_merger:edgeReader_1.worker_pkt_0:128
stream_connect=pma_read_worker_kernel_2.pkt_to_merger:edgeReader_1.worker_pkt_1:128
stream_connect=pma_read_worker_kernel_3.pkt_to_merger:edgeReader_1.worker_pkt_2:128

# edgeReader → GS 计算核
stream_connect=edgeReader_1.little_edge_burst_stm:littleKernelScatterGather_1.part_edge_burst_stm:16
stream_connect=edgeReader_1.little_edge_num_stm:littleKernelScatterGather_1.part_edge_num_stm:16

# GS → merger → apply
stream_connect=littleKernelScatterGather_1.l_tmp_prop_stm:kernelLittleGSMerger_1.l_tmp_prop_stm_1:16
stream_connect=kernelLittleGSMerger_1.l_write_burst_stm:kernelApply_1.l_merged_prop_stm:16

# apply → hbm wrapper
stream_connect=kernelApply_1.prop_write_burst_stm:kernelHBMWrapper_1.prop_write_burst_stm:16

# GS ⇄ hbm wrapper (src 属性预取)
stream_connect=littleKernelScatterGather_1.l_ppb_request_stm:kernelHBMWrapper_1.l_ppb_request_stm_1:16
stream_connect=kernelHBMWrapper_1.l_ppb_response_stm_1:littleKernelScatterGather_1.l_ppb_response_stm:16
