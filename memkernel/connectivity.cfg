[connectivity]
nk=read_kernel:2:read_kernel_1.read_kernel_2
nk=write_kernel:2:write_kernel_1.write_kernel_2
nk=allocate_kernel:1:allocate_kernel_1
nk=free_kernel:1:free_kernel_1
nk=write_mux:1:write_mux_1
nk=read_mux:1:read_mux_1
nk=memlock:1:memlock_1

# 1. memlock -> Muxes and Alloc/Free Kernels (Command Dispatch)
stream_connect=memlock_1.vec_to_write_stream:write_mux_1.vec_info_stream:512
stream_connect=memlock_1.vec_to_read_stream:read_mux_1.vec_info_stream:512
stream_connect=memlock_1.vec_to_alloc_stream:allocate_kernel_1.vec_info_stream:512
stream_connect=memlock_1.vec_to_free_stream:free_kernel_1.vec_info_stream:512

# 2. write_mux -> write_kernels (Write Path)
stream_connect=write_mux_1.vec_info_to_mem_1:write_kernel_1.vec_info_in:512
stream_connect=write_mux_1.data_to_mem_1:write_kernel_1.data_in:512
stream_connect=write_mux_1.vec_info_to_mem_2:write_kernel_2.vec_info_in:512
stream_connect=write_mux_1.data_to_mem_2:write_kernel_2.data_in:512

# 3. read_mux -> read_kernels (Read Path)
stream_connect=read_mux_1.tag_vecinfo_to_mem_1:read_kernel_1.tag_vec_info_in:512
stream_connect=read_mux_1.tag_vecinfo_to_mem_2:read_kernel_2.tag_vec_info_in:512

# 4. read_kernels -> read_mux (Read Data Return)
stream_connect=read_kernel_1.data_out:read_mux_1.data_from_mem_1:512
stream_connect=read_kernel_2.data_out:read_mux_1.data_from_mem_2:512

# 5. Kernels -> Muxes/memlock (ACK Feedback Path)
stream_connect=write_kernel_1.ack_back_to_scheduler:write_mux_1.ack_from_mem_1:512
stream_connect=write_kernel_2.ack_back_to_scheduler:write_mux_1.ack_from_mem_2:512
stream_connect=read_kernel_1.ack_back_to_scheduler:read_mux_1.ack_from_mem_1:512
stream_connect=read_kernel_2.ack_back_to_scheduler:read_mux_1.ack_from_mem_2:512

# 6. Muxes/Alloc/Free -> memlock (Aggregated ACK Feedback)
stream_connect=write_mux_1.ack_to_scheduler:memlock_1.ack_write_stream:512
stream_connect=read_mux_1.ack_to_scheduler:memlock_1.ack_read_stream:512
stream_connect=allocate_kernel_1.ack_stream:memlock_1.ack_alloc_stream:512
stream_connect=free_kernel_1.ack_stream:memlock_1.ack_free_stream:512



sp=write_kernel_1.hbm_ptr:HBM[0]
sp=write_kernel_2.hbm_ptr:HBM[1]
sp=read_kernel_1.hbm_ptr:HBM[0]
sp=read_kernel_2.hbm_ptr:HBM[1]
sp=allocate_kernel_1.bm_ptr:HBM[2]
sp=free_kernel_1.bm_ptr:HBM[2]