[connectivity]

nk=update_message_generator:1:update_message_generator_1
nk=update_message_router_hbm:1:update_message_router_hbm_1
nk=pma_insert_edge_standalone:4:pma_insert_edge_standalone_1,pma_insert_edge_standalone_2,pma_insert_edge_standalone_3,pma_insert_edge_standalone_4
nk=alloc_access_kernel:4:alloc_access_kernel_1,alloc_access_kernel_2,alloc_access_kernel_3,alloc_access_kernel_4
nk=pma_read_router_kernel:1:pma_read_router_kernel_1
nk=pma_read_worker_kernel:4:pma_read_worker_kernel_1,pma_read_worker_kernel_2,pma_read_worker_kernel_3,pma_read_worker_kernel_4
nk=pma_read_merger_kernel:1:pma_read_merger_kernel_1
nk=check_kernel:1:check_kernel_1

# SLR placement
slr=update_message_generator_1:SLR0
slr=update_message_router_hbm_1:SLR0
slr=pma_insert_edge_standalone_1:SLR0
slr=pma_insert_edge_standalone_2:SLR0
slr=pma_insert_edge_standalone_3:SLR1
slr=pma_insert_edge_standalone_4:SLR2
slr=pma_read_worker_kernel_1:SLR0
slr=pma_read_worker_kernel_2:SLR0
slr=pma_read_worker_kernel_3:SLR1
slr=pma_read_worker_kernel_4:SLR1
slr=pma_read_router_kernel_1:SLR0
slr=pma_read_merger_kernel_1:SLR0
slr=check_kernel_1:SLR0
slr=alloc_access_kernel_1:SLR0
slr=alloc_access_kernel_2:SLR0
slr=alloc_access_kernel_3:SLR1
slr=alloc_access_kernel_4:SLR1

# ---- HBM mapping ----
# Generator
sp=update_message_generator_1.src:HBM[30]
sp=update_message_generator_1.dst:HBM[31]

# Router HBM: 4 task buffer ports
sp=update_message_router_hbm_1.task_buf_0:HBM[4]
sp=update_message_router_hbm_1.task_buf_1:HBM[5]
sp=update_message_router_hbm_1.task_buf_2:HBM[6]
sp=update_message_router_hbm_1.task_buf_3:HBM[7]

# Insert edge standalone: m_axi ports (hbm_gate/bs/rw/red + task_buffer + bitmap)
sp=pma_insert_edge_standalone_1.hbm_gate:HBM[0]
sp=pma_insert_edge_standalone_1.hbm_bs:HBM[0]
sp=pma_insert_edge_standalone_1.hbm_rw:HBM[0]
sp=pma_insert_edge_standalone_1.hbm_red:HBM[0]
sp=pma_insert_edge_standalone_1.task_buffer:HBM[4]

sp=pma_insert_edge_standalone_2.hbm_gate:HBM[1]
sp=pma_insert_edge_standalone_2.hbm_bs:HBM[1]
sp=pma_insert_edge_standalone_2.hbm_rw:HBM[1]
sp=pma_insert_edge_standalone_2.hbm_red:HBM[1]
sp=pma_insert_edge_standalone_2.task_buffer:HBM[5]

sp=pma_insert_edge_standalone_3.hbm_gate:HBM[2]
sp=pma_insert_edge_standalone_3.hbm_bs:HBM[2]
sp=pma_insert_edge_standalone_3.hbm_rw:HBM[2]
sp=pma_insert_edge_standalone_3.hbm_red:HBM[2]
sp=pma_insert_edge_standalone_3.task_buffer:HBM[6]

sp=pma_insert_edge_standalone_4.hbm_gate:HBM[3]
sp=pma_insert_edge_standalone_4.hbm_bs:HBM[3]
sp=pma_insert_edge_standalone_4.hbm_rw:HBM[3]
sp=pma_insert_edge_standalone_4.hbm_red:HBM[3]
sp=pma_insert_edge_standalone_4.task_buffer:HBM[7]

# Read workers
sp=pma_read_worker_kernel_1.hbm_ptr:HBM[0]
sp=pma_read_worker_kernel_2.hbm_ptr:HBM[1]
sp=pma_read_worker_kernel_3.hbm_ptr:HBM[2]
sp=pma_read_worker_kernel_4.hbm_ptr:HBM[3]

# Check / Merger
sp=check_kernel_1.coo_src:HBM[24]
sp=check_kernel_1.coo_dst:HBM[25]
sp=check_kernel_1.num_edges:HBM[19]
sp=pma_read_merger_kernel_1.edge_count_ptr:HBM[19]

# alloc_access: no m_axi port — bitmap received/sent via streams from/to insert_edge

# ---- Stream connections ----
# Generator → Router HBM
stream_connect=update_message_generator_1.cmd_to_router:update_message_router_hbm_1.cmd_from_generator:64

# Router HBM → Generator (ACK)
stream_connect=update_message_router_hbm_1.ack_to_generator:update_message_generator_1.ack_from_router:16

# alloc_access ↔ insert_edge (alloc/free commands + bitmap init/final)
stream_connect=pma_insert_edge_standalone_1.alloc_cmd_stream:alloc_access_kernel_1.cmd_stream:16
stream_connect=alloc_access_kernel_1.rsp_stream:pma_insert_edge_standalone_1.alloc_rsp_stream:16
stream_connect=pma_insert_edge_standalone_1.bitmap_init:alloc_access_kernel_1.bitmap_init:16

stream_connect=pma_insert_edge_standalone_2.alloc_cmd_stream:alloc_access_kernel_2.cmd_stream:16
stream_connect=alloc_access_kernel_2.rsp_stream:pma_insert_edge_standalone_2.alloc_rsp_stream:16
stream_connect=pma_insert_edge_standalone_2.bitmap_init:alloc_access_kernel_2.bitmap_init:16

stream_connect=pma_insert_edge_standalone_3.alloc_cmd_stream:alloc_access_kernel_3.cmd_stream:16
stream_connect=alloc_access_kernel_3.rsp_stream:pma_insert_edge_standalone_3.alloc_rsp_stream:16
stream_connect=pma_insert_edge_standalone_3.bitmap_init:alloc_access_kernel_3.bitmap_init:16

stream_connect=pma_insert_edge_standalone_4.alloc_cmd_stream:alloc_access_kernel_4.cmd_stream:16
stream_connect=alloc_access_kernel_4.rsp_stream:pma_insert_edge_standalone_4.alloc_rsp_stream:16
stream_connect=pma_insert_edge_standalone_4.bitmap_init:alloc_access_kernel_4.bitmap_init:16

# Read/check pipeline
stream_connect=check_kernel_1.cmd_to_read:pma_read_router_kernel_1.cmd_in:16
stream_connect=pma_read_router_kernel_1.worker_cmd_0:pma_read_worker_kernel_1.cmd_stream:16
stream_connect=pma_read_router_kernel_1.worker_cmd_1:pma_read_worker_kernel_2.cmd_stream:16
stream_connect=pma_read_router_kernel_1.worker_cmd_2:pma_read_worker_kernel_3.cmd_stream:16
stream_connect=pma_read_router_kernel_1.worker_cmd_3:pma_read_worker_kernel_4.cmd_stream:16
stream_connect=pma_read_router_kernel_1.merger_cmd:pma_read_merger_kernel_1.merger_cmd_stream:16
stream_connect=pma_read_worker_kernel_1.pkt_to_merger:pma_read_merger_kernel_1.worker0_pkt_stream:128
stream_connect=pma_read_worker_kernel_2.pkt_to_merger:pma_read_merger_kernel_1.worker1_pkt_stream:128
stream_connect=pma_read_worker_kernel_3.pkt_to_merger:pma_read_merger_kernel_1.worker2_pkt_stream:128
stream_connect=pma_read_worker_kernel_4.pkt_to_merger:pma_read_merger_kernel_1.worker3_pkt_stream:128
stream_connect=pma_read_merger_kernel_1.data_to_coo_stream:check_kernel_1.data_to_coo_stream:16

[vivado]
prop=fileset.sim_1.xsim.simulate.wdb=false
prop=fileset.sim_1.xsim.simulate.log_all_signals=false
prop=fileset.sim_1.xsim.elaborate.debug_level=typical
[advanced]
[profile]
stall=check_kernel:check_kernel_1
