[connectivity]

#   gate 决策 (decide_merge_path, data_type.h, 编译期切换):
#     bs    → 16 边一批 issue 到 bs_insert
#   redistribution 的 STOP 由 bs_insert 路径负责。

nk=task_reader_kernel:3:task_reader_kernel_1,task_reader_kernel_2,task_reader_kernel_3
nk=bs_insert_kernel:6:bs_insert_kernel_1,bs_insert_kernel_2,bs_insert_kernel_3,bs_insert_kernel_4,bs_insert_kernel_5,bs_insert_kernel_6
nk=redistribution_kernel:3:redistribution_kernel_1,redistribution_kernel_2,redistribution_kernel_3
nk=alloc_access_kernel:3:alloc_access_kernel_1,alloc_access_kernel_2,alloc_access_kernel_3
nk=update_message_generator:1:update_message_generator_1
nk=update_message_router_stream:1:update_message_router_stream_1
nk=pma_read_router_kernel:1:pma_read_router_kernel_1
nk=pma_read_worker_kernel:3:pma_read_worker_kernel_1,pma_read_worker_kernel_2,pma_read_worker_kernel_3
nk=pma_read_merger_kernel:1:pma_read_merger_kernel_1
nk=check_kernel:1:check_kernel_1

# SLR placement (每个 channel 的 3 内核 + alloc + read_worker 同 SLR, 就近 HBM bank)
slr=task_reader_kernel_1:SLR0
slr=task_reader_kernel_2:SLR1
slr=task_reader_kernel_3:SLR2
slr=bs_insert_kernel_1:SLR0
slr=bs_insert_kernel_2:SLR1
slr=bs_insert_kernel_3:SLR2
slr=redistribution_kernel_1:SLR0
slr=redistribution_kernel_2:SLR1
slr=redistribution_kernel_3:SLR2
slr=pma_read_worker_kernel_1:SLR0
slr=pma_read_worker_kernel_2:SLR1
slr=pma_read_worker_kernel_3:SLR2
slr=pma_read_router_kernel_1:SLR0
slr=pma_read_merger_kernel_1:SLR1
slr=check_kernel_1:SLR0
slr=update_message_generator_1:SLR2
slr=update_message_router_stream_1:SLR2
slr=alloc_access_kernel_1:SLR0
slr=alloc_access_kernel_2:SLR1
slr=alloc_access_kernel_3:SLR2

# ---- HBM mapping (每个 m_axi 端口映射 2 个 HBM 通道) ----
# Generator
sp=update_message_generator_1.src:HBM[16:17]
sp=update_message_generator_1.dst:HBM[18:19]

# task_reader: gate m_axi 读本 channel PMA 的 VEC_INFO/header/VC (gate 决策辅助)
sp=task_reader_kernel_1.hbm_gate:HBM[0:1]
sp=task_reader_kernel_2.hbm_gate:HBM[2:3]
sp=task_reader_kernel_3.hbm_gate:HBM[4:5]

# bs_insert: 2 ports per instance, 同 bank (2 通道)


# redistribution: PMA 口同 bank, collect buffer 备用 bank (读写分离)
sp=redistribution_kernel_1.hbm_red:HBM[0:1]
sp=redistribution_kernel_1.hbm_buffer_for_red:HBM[6:7]
sp=redistribution_kernel_2.hbm_red:HBM[2:3]
sp=redistribution_kernel_2.hbm_buffer_for_red:HBM[8:9]
sp=redistribution_kernel_3.hbm_red:HBM[4:5]
sp=redistribution_kernel_3.hbm_buffer_for_red:HBM[10:11]

# Read workers: 同 insert bank per channel
sp=pma_read_worker_kernel_1.hbm_ptr:HBM[0:1]
sp=pma_read_worker_kernel_2.hbm_ptr:HBM[2:3]
sp=pma_read_worker_kernel_3.hbm_ptr:HBM[4:5]

# Check
sp=check_kernel_1.coo_src:HBM[20:21]
sp=check_kernel_1.coo_dst:HBM[22:23]
sp=check_kernel_1.num_edges:HBM[24:25]

# alloc_access: 无 m_axi — bitmap 经流从 redistribution 收

# ---- Stream connections ----
# Generator → Router Stream
stream_connect=update_message_generator_1.cmd_to_router:update_message_router_stream_1.cmd_from_generator:64
stream_connect=update_message_router_stream_1.ack_to_generator:update_message_generator_1.ack_from_router:16

# Router Stream → task_reader (online update path)
stream_connect=update_message_router_stream_1.cmd_to_worker_0:task_reader_kernel_1.online_in:16
stream_connect=update_message_router_stream_1.cmd_to_worker_1:task_reader_kernel_2.online_in:16
stream_connect=update_message_router_stream_1.cmd_to_worker_2:task_reader_kernel_3.online_in:16
stream_connect=task_reader_kernel_1.ack_to_router:update_message_router_stream_1.ack_from_worker_0:16
stream_connect=task_reader_kernel_2.ack_to_router:update_message_router_stream_1.ack_from_worker_1:16
stream_connect=task_reader_kernel_3.ack_to_router:update_message_router_stream_1.ack_from_worker_2:16

# task_reader → redistribution (pre-expand)
stream_connect=task_reader_kernel_1.pre_expand_out:redistribution_kernel_1.pre_expand_in:16
stream_connect=task_reader_kernel_2.pre_expand_out:redistribution_kernel_2.pre_expand_in:16
stream_connect=task_reader_kernel_3.pre_expand_out:redistribution_kernel_3.pre_expand_in:16


# bs_insert → redistribution (overflow rebalance tasks; 整合后 merge 不走此流)

# redistribution → task_reader (pre_ack) / bs_insert (redist_ack)
stream_connect=redistribution_kernel_1.pre_ack_out:task_reader_kernel_1.pre_ack_in:16
stream_connect=redistribution_kernel_2.pre_ack_out:task_reader_kernel_2.pre_ack_in:16
stream_connect=redistribution_kernel_3.pre_ack_out:task_reader_kernel_3.pre_ack_in:16


# alloc_access ↔ redistribution (alloc/free + bitmap init)
stream_connect=redistribution_kernel_1.alloc_cmd_stream:alloc_access_kernel_1.cmd_stream:16
stream_connect=alloc_access_kernel_1.rsp_stream:redistribution_kernel_1.alloc_rsp_stream:16
stream_connect=redistribution_kernel_1.bitmap_init:alloc_access_kernel_1.bitmap_init:16
stream_connect=redistribution_kernel_2.alloc_cmd_stream:alloc_access_kernel_2.cmd_stream:16
stream_connect=alloc_access_kernel_2.rsp_stream:redistribution_kernel_2.alloc_rsp_stream:16
stream_connect=redistribution_kernel_2.bitmap_init:alloc_access_kernel_2.bitmap_init:16
stream_connect=redistribution_kernel_3.alloc_cmd_stream:alloc_access_kernel_3.cmd_stream:16
stream_connect=alloc_access_kernel_3.rsp_stream:redistribution_kernel_3.alloc_rsp_stream:16
stream_connect=redistribution_kernel_3.bitmap_init:alloc_access_kernel_3.bitmap_init:16

# Read/check pipeline
stream_connect=check_kernel_1.cmd_to_read:pma_read_router_kernel_1.cmd_in:16
stream_connect=pma_read_router_kernel_1.worker_cmd_0:pma_read_worker_kernel_1.cmd_stream:16
stream_connect=pma_read_router_kernel_1.worker_cmd_1:pma_read_worker_kernel_2.cmd_stream:16
stream_connect=pma_read_router_kernel_1.worker_cmd_2:pma_read_worker_kernel_3.cmd_stream:16
stream_connect=pma_read_router_kernel_1.merger_cmd:pma_read_merger_kernel_1.merger_cmd_stream:16
stream_connect=pma_read_worker_kernel_1.pkt_to_merger:pma_read_merger_kernel_1.worker0_pkt_stream:128
stream_connect=pma_read_worker_kernel_2.pkt_to_merger:pma_read_merger_kernel_1.worker1_pkt_stream:128
stream_connect=pma_read_worker_kernel_3.pkt_to_merger:pma_read_merger_kernel_1.worker2_pkt_stream:128
stream_connect=pma_read_merger_kernel_1.data_to_coo_stream:check_kernel_1.data_to_coo_stream:16

# Two BS workers share each channel-local redistribution.
sp=bs_insert_kernel_1.hbm_bs:HBM[0:1]
sp=bs_insert_kernel_1.hbm_rw:HBM[0:1]
sp=bs_insert_kernel_2.hbm_bs:HBM[0:1]
sp=bs_insert_kernel_2.hbm_rw:HBM[0:1]
sp=bs_insert_kernel_3.hbm_bs:HBM[2:3]
sp=bs_insert_kernel_3.hbm_rw:HBM[2:3]
sp=bs_insert_kernel_4.hbm_bs:HBM[2:3]
sp=bs_insert_kernel_4.hbm_rw:HBM[2:3]
sp=bs_insert_kernel_5.hbm_bs:HBM[4:5]
sp=bs_insert_kernel_5.hbm_rw:HBM[4:5]
sp=bs_insert_kernel_6.hbm_bs:HBM[4:5]
sp=bs_insert_kernel_6.hbm_rw:HBM[4:5]

# Each task_reader routes a PMA to exactly one BS; the route is stable across waves.
stream_connect=task_reader_kernel_1.edge_out_bs_1:bs_insert_kernel_1.edge_in:32
stream_connect=task_reader_kernel_1.edge_out_bs_2:bs_insert_kernel_2.edge_in:32
stream_connect=task_reader_kernel_2.edge_out_bs_1:bs_insert_kernel_3.edge_in:32
stream_connect=task_reader_kernel_2.edge_out_bs_2:bs_insert_kernel_4.edge_in:32
stream_connect=task_reader_kernel_3.edge_out_bs_1:bs_insert_kernel_5.edge_in:32
stream_connect=task_reader_kernel_3.edge_out_bs_2:bs_insert_kernel_6.edge_in:32

# Shared redistribution task/ACK channels.  ACK routing uses the PMA index.
stream_connect=bs_insert_kernel_1.task_out:redistribution_kernel_1.task_in_1:64
stream_connect=bs_insert_kernel_2.task_out:redistribution_kernel_1.task_in_2:64
stream_connect=bs_insert_kernel_3.task_out:redistribution_kernel_2.task_in_1:64
stream_connect=bs_insert_kernel_4.task_out:redistribution_kernel_2.task_in_2:64
stream_connect=bs_insert_kernel_5.task_out:redistribution_kernel_3.task_in_1:64
stream_connect=bs_insert_kernel_6.task_out:redistribution_kernel_3.task_in_2:64
stream_connect=redistribution_kernel_1.redist_ack_out_1:bs_insert_kernel_1.redist_ack_in:16
stream_connect=redistribution_kernel_1.redist_ack_out_2:bs_insert_kernel_2.redist_ack_in:16
stream_connect=redistribution_kernel_2.redist_ack_out_1:bs_insert_kernel_3.redist_ack_in:16
stream_connect=redistribution_kernel_2.redist_ack_out_2:bs_insert_kernel_4.redist_ack_in:16
stream_connect=redistribution_kernel_3.redist_ack_out_1:bs_insert_kernel_5.redist_ack_in:16
stream_connect=redistribution_kernel_3.redist_ack_out_2:bs_insert_kernel_6.redist_ack_in:16

# BS completion ACKs return to the owning task_reader.
stream_connect=bs_insert_kernel_1.ack_out:task_reader_kernel_1.ack_in_bs_1:16
stream_connect=bs_insert_kernel_2.ack_out:task_reader_kernel_1.ack_in_bs_2:16
stream_connect=bs_insert_kernel_3.ack_out:task_reader_kernel_2.ack_in_bs_1:16
stream_connect=bs_insert_kernel_4.ack_out:task_reader_kernel_2.ack_in_bs_2:16
stream_connect=bs_insert_kernel_5.ack_out:task_reader_kernel_3.ack_in_bs_1:16
stream_connect=bs_insert_kernel_6.ack_out:task_reader_kernel_3.ack_in_bs_2:16
